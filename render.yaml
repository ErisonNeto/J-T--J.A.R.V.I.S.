# Web frontend only. Reuses the existing JT API and PostgreSQL on the VM.
# Apply only after the JARVIS backend is mounted on the existing API.
services:
  - type: web
    name: jt-jarvis-web
    runtime: node
    plan: free
    region: oregon
    branch: feat/jarvis-web
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /jarvis
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 24.22.0
      - key: JARVIS_API_URL
        value: https://jt-api.rockettechbr.com.br/jarvis
      - key: JARVIS_BRIDGE_TOKEN
        sync: false
